<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Audax site build</title>
  <!-- Opened automatically by tools/build.py. Compiles every .jsx file listed in dev.html
       with the same Babel the site used in the browser, and hands the results back to
       build.py, which writes them to built/. Nothing here is served to visitors. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 40px auto; max-width: 640px; color: #14130E; }
    li.ok::marker { color: #1F4D2E; } li.bad { color: #b00020; }
    #status { font-weight: 600; margin: 16px 0; }
  </style>
</head>
<body>
  <h1>Building the Audax site</h1>
  <p id="status">Starting&hellip;</p>
  <ul id="log"></ul>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const log = document.getElementById('log');
      const line = (text, cls) => { const li = document.createElement('li'); li.textContent = text; if (cls) li.className = cls; log.appendChild(li); };
      try {
        const dev = await (await fetch('/dev.html', { cache: 'no-store' })).text();
        const files = [...dev.matchAll(/<script\s+type="text\/babel"\s+src="([^"?]+\.jsx)(?:\?[^"]*)?"/g)].map(m => m[1]);
        if (!files.length) throw new Error('No text/babel scripts found in dev.html');
        status.textContent = 'Compiling ' + files.length + ' files…';
        let done = 0;
        for (const f of files) {
          const src = await (await fetch('/' + f, { cache: 'no-store' })).text();
          const out = Babel.transform(src, { presets: ['react'], sourceType: 'script', filename: f, compact: false, retainLines: false }).code;
          const banner = '/* Generated from ' + f + ' by tools/build.py. Edit the .jsx file and rebuild; do not edit this file. */\n';
          const name = f.replace(/\.jsx$/, '.js');
          const r = await fetch('/__save?name=' + encodeURIComponent(name), { method: 'POST', body: banner + out });
          if (!r.ok) throw new Error('Save failed for ' + name + ': ' + r.status);
          done++;
          line(f + ' → built/' + name + '  (' + Math.round(out.length / 1024) + ' KB)', 'ok');
        }
        await fetch('/__done?count=' + done, { method: 'POST' });
        status.textContent = 'Done: ' + done + ' files compiled. You can close this tab.';
      } catch (e) {
        status.textContent = 'Build failed: ' + e.message;
        line(String(e && e.stack || e), 'bad');
        fetch('/__done?error=' + encodeURIComponent(e.message), { method: 'POST' });
      }
    })();
  </script>
</body>
</html>
